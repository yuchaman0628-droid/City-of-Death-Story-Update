<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamanion's Stream Catch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            background: linear-gradient(135deg, #0f2b1d 0%, #1b4d3e 100%);
            border: 4px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
            display: block;
            margin: 0 auto;
        }
        .ui {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h2>Chamanion's Stream Catch</h2>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div class="ui">スコア: <span id="score">0</span></div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    let score = 0;
    let isGameOver = false;

    // プレイヤー（Chamanionのアイコンやキャラクター）
    const player = {
        x: 175,
        y: 430,
        width: 50,
        height: 30,
        speed: 6,
        dx: 0
    };

    // 落ちてくるアイテム（BGMノートや配信アイテム）
    let items = [];
    let itemTimer = 0;

    // キー入力管理
    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    function spawnItem() {
        const types = ['note', 'star'];
        const type = types[Math.floor(Math.random() * types.length)];
        items.push({
            x: Math.random() * (canvas.width - 30),
            y: -30,
            size: 25,
            speed: 3 + Math.random() * 2,
            type: type
        });
    }

    function update() {
        if (isGameOver) return;

        // プレイヤーの移動
        if (keys["ArrowLeft"] || keys["KeyA"]) {
            player.x -= player.speed;
        }
        if (keys["ArrowRight"] || keys["KeyD"]) {
            player.x += player.speed;
        }

        // 画面外防止
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // アイテム生成
        itemTimer++;
        if (itemTimer % 40 === 0) {
            spawnItem();
        }

        // アイテム更新
        for (let i = items.length - 1; i >= 0; i--) {
            items[i].y += items[i].speed;

            // 当たり判定
            if (
                items[i].x < player.x + player.width &&
                items[i].x + items[i].size > player.x &&
                items[i].y < player.y + player.height &&
                items[i].y + items[i].size > player.y
            ) {
                score += items[i].type === 'star' ? 20 : 10;
                scoreElement.innerText = score;
                items.splice(i, 1);
                continue;
            }

            // 画面外に落ちた場合
            if (items[i].y > canvas.height) {
                items.splice(i, 1);
            }
        }
    }

    function draw() {
        // 背景クリア
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // プレイヤーを描画
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "12px sans-serif";
        ctx.fillText("Chamanion", player.x + 5, player.y + 20);

        // アイテムを描画
        items.forEach(item => {
            ctx.fillStyle = item.type === 'star' ? "#f1c40f" : "#e74c3c";
            ctx.beginPath();
            ctx.arc(item.x + item.size / 2, item.y + item.size / 2, item.size / 2, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function loop() {
        update();
        draw();
        if (!isGameOver) {
            requestAnimationFrame(loop);
        }
    }

    loop();
</script>

</body>
</html>
